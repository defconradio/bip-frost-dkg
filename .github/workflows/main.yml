name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements-dev.txt"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: ./python/tests.sh

      - name: Run examples
        run: |
          ./python/example.py && ./python/example.py --faulty-participant && ./python/example.py --faulty-coordinator
          python3 python/examples/alice_bob_peter_dkg.py

      - name: Check that test vectors are up to date
        run: ./python/gen_vectors.py && git diff --exit-code

      - name: Check if README.md has latest pydoc export
        run: ./update-pydoc.sh && git diff --exit-code

